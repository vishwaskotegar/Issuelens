# A generic, single database configuration for Alembic.

[alembic]
# path to migration scripts
script_location = src/issuelens/persistence/migrations

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
file_template = %%(rev)s_%%(slug)s

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without a corresponding .py file to be detected
# sourceless = false

# version location specification; This defaults to src/issuelens/persistence/migrations/versions.
# version_locations = %(here)s/bar:%(here)s/bat:src/issuelens/persistence/migrations/versions

# version path separator; as mentioned above, this defaults to the system separator.
# version_path_separator = :

# the output encoding used when revisions are written from script.py.mako
output_encoding = utf-8

sqlalchemy.url = postgresql+psycopg://user:password@localhost:5432/issuelens

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

